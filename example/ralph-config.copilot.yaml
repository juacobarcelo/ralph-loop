max_retries: 3

backends:
  coder:
    engine: copilot
    timeout_seconds: 900
    extra_flags:
      - --allow-all
      - --allow-all-urls
      - --enable-all-github-mcp-tools
  inspector:
    engine: copilot
    timeout_seconds: 300
    extra_flags:
      - --allow-all
      - --allow-all-urls
      - --enable-all-github-mcp-tools
  visual:
    engine: copilot
    timeout_seconds: 300
    extra_flags:
      - --allow-all
      - --allow-all-urls
      - --enable-all-github-mcp-tools
      - --additional-mcp-config
      - "@/workspace/example/copilot-mcp.chrome.json"

verify_commands:
  - "python -m pytest -q tests"

auth:
  copilot:
    env: []
    mount:
      - source: ~/.config/gh
        target: ~/.config/gh
