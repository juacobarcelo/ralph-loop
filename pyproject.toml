[project]
name = "ralph-loop"
version = "0.1.0"
description = "AFK AI coding loop orchestrator with multi-model strategy and feedback accumulation"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "jinja2>=3.1",
    "pydantic>=2.0",
    "python-frontmatter>=1.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
visual = ["playwright>=1.40", "pillow>=10.0"]
dev = ["mypy", "pytest>=8.0", "pytest-cov", "ruff", "types-PyYAML"]

[project.scripts]
ralph-loop = "ralph_loop.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = "playwright.*"
ignore_missing_imports = true

[tool.coverage.run]
source = ["ralph_loop"]
timid = true
