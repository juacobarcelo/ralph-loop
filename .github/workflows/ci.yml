name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Ruff lint
        run: ruff check ralph_loop tests
      - name: Ruff format check
        run: ruff format --check ralph_loop tests
      - name: Mypy
        run: mypy ralph_loop
      - name: Tests
        run: python -B -m pytest tests -v --cov=ralph_loop --cov-report=term-missing

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build docker targets
        run: |
          docker build --target base -t ralph-loop-base .
          docker build --target codex -t ralph-loop-codex .
          docker build --target copilot -t ralph-loop-copilot .
          docker build --target claude -t ralph-loop-claude .
